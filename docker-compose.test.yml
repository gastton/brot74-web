services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brot74
      POSTGRES_PASSWORD: brot74
      POSTGRES_DB: brot74_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brot74"]
      interval: 5s
      timeout: 5s
      retries: 5
