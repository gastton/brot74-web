name: Dependabot Triage Agent

# BRT-141: agente de triage de PRs de Dependabot (BRT-137). Separado de
# test.yml a propósito: no es CI de la app, es un proceso de mantenimiento
# del repo. Corre en cron todos los días y se puede disparar a mano.
#
# Detecta + clasifica (BRT-139/BRT-140), aprueba las no críticas con CI
# verde (Nivel 1: BRT-142), gestiona tickets de Jira y avisa por Slack cada
# crítica nueva (BRT-143/BRT-144).

on:
  schedule:
    # 12:00 UTC = 09:00 en Argentina (UTC-3 todo el año, sin horario de verano).
    - cron: "0 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: dependabot-triage
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  # No alcanza para leer Dependabot Alerts (ver DEPENDABOT_ALERTS_TOKEN más
  # abajo — BRT-147, confirmado con 403 en corrida real de BRT-141), pero se
  # deja igual: es el permiso de menor privilegio correcto para lo demás.
  security-events: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: este job no necesita nada de lo que instalan los
      # postinstall de prisma/sharp/playwright (no corre build ni Prisma) —
      # evita ejecutar lifecycle scripts de terceros en un workflow que
      # justamente existe para manejar riesgo de dependencias.
      - run: npm ci --ignore-scripts

      - name: Detectar, clasificar, aprobar y actualizar Jira
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # BRT-147: PAT propio con permiso de lectura de Dependabot Alerts
          # (el GITHUB_TOKEN default no puede leer ese endpoint). Optativo:
          # si el secret no existe, el paso sigue andando sin severidad.
          DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          # BRT-149: GitHub bloquea a nivel de plataforma que el GITHUB_TOKEN
          # default apruebe PRs ("GitHub Actions is not permitted to approve
          # pull requests") — hace falta un PAT de una identidad real.
          # Optativo: sin este secret, el agente detecta/clasifica/reporta
          # pero no aprueba nada.
          PR_APPROVE_TOKEN: ${{ secrets.PR_APPROVE_TOKEN }}
          # BRT-143: credenciales de Jira (API token propio, no OAuth) para
          # crear/buscar tickets. Optativo: sin estos secrets, el paso sigue
          # corriendo (detección + clasificación + Nivel 1) sin tocar Jira.
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # BRT-144: Incoming Webhook del canal de Slack del proyecto.
          # Optativo: sin este secret, se crean los tickets de Jira pero no
          # se avisa por Slack.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run dependabot:triage
